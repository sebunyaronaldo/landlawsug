services:
  neo4j:
    image: neo4j:5.26-community
    container_name: landlawsug-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (drivers, cypher-shell)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
      - ./cypher:/import/cypher:ro
      - ./queries:/import/queries:ro

volumes:
  neo4j_data:
